<div class="col-md-3">
  <div class="card track-card">
    <div class="card-body">
      <h5 class="card-title">{{name}}</h5>
      <h6 class="card-subtitle mb-2 text-muted">{{artist}}</h6>
      <p class="card-text">
        <strong>Genre:</strong> {{genre}}<br>
        <strong>Duration:</strong> {{durationMs}}
      </p>
      <button class="btn btn-primary add-listened-btn" data-track='{{track}}'>Add to my list</button>
    </div>
  </div>
</div>
